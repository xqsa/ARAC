[project]
name = "arac"
version = "0.1.0"
description = "Reference-blind RDDSM evidence overlay for two-phase cooperative coevolution."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hcc = [
    "cma==4.4.4",
    "numpy==2.3.5",
    "PyYAML==6.0.3",
    "scipy==1.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests that run the HCC subprocess smoke runner",
]

[tool.ruff]
line-length = 100
target-version = "py311"
