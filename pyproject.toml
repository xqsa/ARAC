[project]
name = "arac"
version = "0.1.0"
description = "Clean scaffold for reference-blind evidence-to-intervention utility mapping."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hcc = [
    "cma==4.4.4",
    "matplotlib==3.11.0",
    "numpy==2.3.5",
    "PyYAML==6.0.3",
    "scipy==1.18.0",
    "torch==2.12.1",
]
causal-audit = [
    "joblib==1.5.3",
    "narwhals==2.24.0",
    "numpy==2.3.5",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "threadpoolctl==3.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests that run the HCC subprocess smoke runner",
]

[tool.ruff]
line-length = 100
target-version = "py311"
